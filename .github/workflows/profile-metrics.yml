name: Generate Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "20 03 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  profile-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate profile overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          user: Gh0stDeveloper
          filename: metrics.profile.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Mexico_City

      - name: Generate isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          user: Gh0stDeveloper
          filename: metrics.isocalendar.purple.svg
          template: classic
          base: ""
          config_timezone: America/Mexico_City
          config_order: isocalendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
